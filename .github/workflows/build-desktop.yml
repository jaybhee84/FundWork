name: Build desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: FundWork-Windows-x64
            pattern: dist/*.exe
          - label: macOS Apple Silicon
            os: macos-15
            command: npm run dist:mac -- --arm64
            artifact: FundWork-macOS-arm64
            pattern: dist/*.dmg
          - label: macOS Intel
            os: macos-15-intel
            command: npm run dist:mac -- --x64
            artifact: FundWork-macOS-x64
            pattern: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e 'const expected="v"+require("./package.json").version; if(process.env.GITHUB_REF_NAME!==expected)throw new Error("Tag must equal "+expected)'
      - name: Build installer
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "FundWork $RELEASE_TAG" --notes-file docs/releases.md
          fi
          gh release upload "$RELEASE_TAG" installers/*.exe installers/*.dmg --clobber
